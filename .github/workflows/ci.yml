name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - release-*
      - verkle
      - performance
      - '*-devnet-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Xmx6g -Dorg.gradle.parallel=true"

# Job matrix:
# Generated Besu-authority commits are workflow-neutral; this PR-head run is the CI authority.
#
#   push to main:      [gradleWrapper, spotless, checkLicense]
#                    → build
#                    → dockerBuildTest (docker-build-test.yml: build + goss-test)
#                    → dockerPublish   (docker-publish.yml: push `develop` image + sign)
#
#   pull_request:    [gradleWrapper, spotless, checkLicense]
#                  → [build, verifySourceMetadata, unitTests, integrationTests, referenceTests, acceptanceTests]
#                  → dockerBuildTest (docker-build-test.yml: build + goss-test; dockerPublish skipped - not on main)
#                  → allTestsPassed (PR merge gate).

jobs:
  checkNoBinaries:
    name: "No binaries check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Check for binary files
        run: |
          binaries=$(git ls-files -z | xargs -0 file | awk -F': ' 'tolower($2) ~ /elf|mach-o|pe32|ms-dos|compiled/' || true)
          extensions=$(git ls-files | grep -iE '\.(exe|dll|so|dylib|class|pyc)$' || true)
          if [ -n "$binaries" ] || [ -n "$extensions" ]; then
            echo "Binary files found:"
            [ -n "$binaries" ] && echo "$binaries"
            [ -n "$extensions" ] && echo "$extensions"
            exit 1
          fi

  gradleWrapper:
    name: "Gradle Wrapper Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: gradle/actions/wrapper-validation@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1

  spotless:
    name: "Spotless"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1
        with:
          cache-disabled: true
      - name: run spotless
        run: ./gradlew spotlessCheck

  upstreamSyncProbe:
    name: "Latest Besu authority gate"
    if: github.event_name == 'pull_request' && github.head_ref == 'sila/besu-close-20260923'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sila closure branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify pinned upstream Besu authority is still current
        run: |
          expected="cf89071f9d6dddf7997f35e09929fe059f82ecd1"
          actual="$(git ls-remote https://github.com/besu-eth/besu.git refs/heads/main | awk '{print $1}')"
          echo "EXPECTED_UPSTREAM=$expected"
          echo "ACTUAL_UPSTREAM=$actual"
          if [ "$actual" != "$expected" ]; then
            echo "UPSTREAM_ADVANCED=1"
            exit 1
          fi
          if ! git log --format=%B --all | grep -Fq "Upstream-Besu: $expected"; then
            echo "PINNED_AUTHORITY_COMMIT_NOT_IN_HISTORY=1"
            exit 1
          fi
          echo "UPSTREAM_AUTHORITY_GATE=PASS"

  silaIdentityGate:
    name: "Pure Sila identity gate"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [upstreamSyncProbe]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Reject Ethereum-affiliated runtime and dependency identities
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          patterns = [
              ("WEB3J_DEPENDENCY", re.compile(r"org\.web3j(?=[:.])")),
              ("ETHEREUM_JAVA_NAMESPACE", re.compile(r"org\.ethereum(?=\.)")),
              ("ETHEREUM_GITHUB_AUTHORITY", re.compile(r"github\.com/ethereum/")),
              ("ETHEREUM_MAVEN_GROUP", re.compile(r"(?:group\s*[:=]\s*['\"]ethereum['\"]|group=\"ethereum\")")),
              ("ETHEREUM_CKZG_NAMESPACE", re.compile(r"ethereum\.ckzg4844")),
              ("ETHSTATS_IDENTITY", re.compile(r"(?:org\.hyperledger\.besu\.ethstats|:sila:ethstats|sila/ethstats)")),
          ]

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          blockers = []
          for raw in tracked:
              if not raw or raw.startswith(".github/workflows/"):
                  continue
              path = Path(raw)
              if not path.is_file():
                  continue
              try:
                  body = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  body = ""
              target = raw + "\n" + body
              for label, pattern in patterns:
                  if pattern.search(target):
                      blockers.append((label, raw))
          unique = sorted(set(blockers))
          print(f"SILA_IDENTITY_BLOCKER_COUNT={len(unique)}")
          for label, path in unique[:400]:
              print(f"SILA_IDENTITY_BLOCKER {label} {path}")
          if unique:
              raise SystemExit(3)
          print("PURE_SILA_IDENTITY_GATE=PASS")
          PY

  checkLicense:
    name: "Check License"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1
        with:
          cache-disabled: true
      - name: run checkLicense
        run: ./gradlew --no-parallel checkLicense # no-parallel due to https://github.com/jk1/Gradle-License-Report/issues/337
      - name: upload license report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: checkLicense
          path: build/reports/dependency-license

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [spotless, checkLicense, gradleWrapper, checkNoBinaries, upstreamSyncProbe]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1
        with:
          cache-disabled: true
      - name: Gradle Build
        run: ./gradlew build -x test -x spotlessCheck
      - name: Upload tar.gz
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: besu-tar
          path: build/distributions/besu-*.tar.gz
          retention-days: 10
      - name: Upload zip
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: besu-zip
          path: build/distributions/besu-*.zip
          retention-days: 10
      - name: Upload workspace build
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: assemble-output
          path: |
            ./
            !./.git/**
          retention-days: 1
          include-hidden-files: 'true'

  # Supply chain security: verifies that source JARs for all dependencies are recorded
  # in verification-metadata.xml. Prevents tampered or undeclared source artifacts
  # from being introduced without explicit sign-off.
  verifySourceMetadata:
    name: "Verify Dependency Source Metadata"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [spotless, checkLicense, gradleWrapper, checkNoBinaries, upstreamSyncProbe]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1
        with:
          cache-disabled: true
      - name: Verify source artifacts recorded in verification-metadata.xml
        run: ./gradlew verifySourceArtifacts

  # Tests
  # Each suite has its suite-tests-passed job in the file directly
  unitTests:
    if: github.event_name == 'pull_request'
    needs: [spotless, checkLicense, gradleWrapper, checkNoBinaries, upstreamSyncProbe]
    permissions:
      actions: read
      contents: read
      checks: write
      statuses: write
    uses: ./.github/workflows/unit-tests.yml

  integrationTests:
    if: github.event_name == 'pull_request'
    needs: [spotless, checkLicense, gradleWrapper, checkNoBinaries, upstreamSyncProbe]
    permissions:
      actions: read
      contents: read
      checks: write
      statuses: write      
    uses: ./.github/workflows/integration-tests.yml

  referenceTests:
    if: github.event_name == 'pull_request'
    needs: [spotless, checkLicense, gradleWrapper, checkNoBinaries, upstreamSyncProbe]
    permissions:
      actions: read
      contents: read
      packages: read
      checks: write
      statuses: write
    uses: ./.github/workflows/reference-tests.yml
    secrets: inherit

  acceptanceTests:
    if: github.event_name == 'pull_request'
    needs: [spotless, checkLicense, gradleWrapper, checkNoBinaries, upstreamSyncProbe]
    permissions:
      actions: read
      contents: read
      checks: write
      statuses: write
    uses: ./.github/workflows/acceptance-tests.yml
    secrets: inherit

  dockerBuildTest:
    needs: build
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/docker-build-test.yml
    with:
      assemble_run_id: ${{ github.run_id }}
      cache_scope: ci-pr-build
    secrets: inherit

  # only fires on merge to main, so 'develop' is kept up to date
  dockerPublish:
    needs: [build, dockerBuildTest]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: develop
      cache_scope: ci-pr-build
    secrets: inherit

  allTestsPassed:
    name: allTestsPassed
    runs-on: ubuntu-latest
    needs: [verifySourceMetadata, unitTests, integrationTests, referenceTests, acceptanceTests, dockerBuildTest]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Fail on workflow error
        run: exit 1
        if: >-
          ${{
            contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
            || contains(needs.*.result, 'skipped')
          }}    