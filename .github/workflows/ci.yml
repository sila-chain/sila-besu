name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - release-*
      - verkle
      - performance
      - '*-devnet-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Xmx6g -Dorg.gradle.parallel=true"

# Job matrix:
#
#   push to main:      [gradleWrapper, spotless, checkLicense]
#                    → build
#                    → dockerBuildTest (docker-build-test.yml: build + goss-test)
#                    → dockerPublish   (docker-publish.yml: push `develop` image + sign)
#
#   pull_request:    [gradleWrapper, spotless, checkLicense]
#                  → [build, verifySourceMetadata, unitTests, integrationTests, referenceTests, acceptanceTests]
#                  → dockerBuildTest (docker-build-test.yml: build + goss-test; dockerPublish skipped - not on main)
#                  → allTestsPassed (PR merge gate).

jobs:
  checkNoBinaries:
    name: "No binaries check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Check for binary files
        run: |
          binaries=$(git ls-files -z | xargs -0 file | awk -F': ' 'tolower($2) ~ /elf|mach-o|pe32|ms-dos|compiled/' || true)
          extensions=$(git ls-files | grep -iE '\.(exe|dll|so|dylib|class|pyc)$' || true)
          if [ -n "$binaries" ] || [ -n "$extensions" ]; then
            echo "Binary files found:"
            [ -n "$binaries" ] && echo "$binaries"
            [ -n "$extensions" ] && echo "$extensions"
            exit 1
          fi

  gradleWrapper:
    name: "Gradle Wrapper Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: gradle/actions/wrapper-validation@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1

  spotless:
    name: "Spotless"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1
        with:
          cache-disabled: true
      - name: run spotless
        run: ./gradlew spotlessCheck

  upstreamSyncProbe:
    name: "Latest Besu safe Sila generation probe"
    if: github.event_name == 'pull_request' && github.head_ref == 'sila/besu-close-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Sila closure branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1
        with:
          cache-disabled: true
      - name: Generate safe Sila tree from latest Besu authority
        run: |
          git fetch --no-tags https://github.com/besu-eth/besu.git \
            a7867768741ffe7239bab07c38926d065ab16229:refs/remotes/upstream/latest
          git worktree add --detach /tmp/sila-latest refs/remotes/upstream/latest
          cd /tmp/sila-latest
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          def token_transform(s):
              # Protocol-owned namespaces and explicit identity words only.
              s = s.replace("org.hyperledger.besu.ethereum", "org.hyperledger.besu.sila")
              s = s.replace("org.hyperledger.besu.evm", "org.hyperledger.besu.savm")
              s = s.replace("github.com/ethereum", "github.com/sila")
              s = s.replace("ethereum.org", "sila.org")
              s = s.replace("eips.ethereum.org", "sips.sila.org")
              s = s.replace("Ethereum Foundation", "Sila Foundation")
              s = s.replace("Etherscan", "SilaScan")

              # Exact/boundary protocol identifiers; never alter substrings in independent words.
              rules = [
                  (r"\bETHEREUM\b", "SILA"),
                  (r"\bEthereum\b", "Sila"),
                  (r"\bethereum\b", "sila"),
                  (r"\bWETH\b", "WSIL"), (r"\bIWETH\b", "IWSIL"),
                  (r"\bIERC(?=[A-Z0-9_]|\b)", "ISRC"),
                  (r"\bAERC(?=[A-Z0-9_]|\b)", "ASRC"),
                  (r"\bIEIP(?=[A-Z0-9_]|\b)", "ISIP"),
                  (r"\bERCS\b", "SRCS"), (r"\bERCs\b", "SRCs"),
                  (r"\bERC(?=[0-9A-Z_]|\b)", "SRC"),
                  (r"\berc(?=[0-9_\-]|\b)", "src"),
                  (r"\bEIPs\b", "SIPs"), (r"\beips\b", "sips"),
                  (r"\bEIP(?=[0-9A-Z_]|\b)", "SIP"),
                  (r"\beip(?=[0-9_\-]|\b)", "sip"),
                  (r"\bEVM(?=[A-Z0-9_]|\b)", "SAVM"),
                  (r"\bEvm(?=[A-Z0-9_]|\b)", "Savm"),
                  (r"\bevm(?=[A-Z0-9_\-]|\b)", "savm"),
                  (r"\bETH(?=[A-Z0-9_]|\b)", "SIL"),
                  (r"\bEth(?=[A-Z0-9_]|\b)", "Sil"),
                  (r"\beth(?=[A-Z0-9_]|\b)", "sil"),
                  (r"\bEther(?=[A-Z0-9_]|\b)", "Sila"),
                  (r"\bether(?=[A-Z0-9_]|\b)", "sila"),
                  (r"\bMainnet(?=[A-Z0-9_]|\b)", "SilaMainnet"),
                  (r"\bMAINNET\b", "SILA_MAINNET"),
                  (r"\bSepolia(?=[A-Z0-9_]|\b)", "SilaSepolia"),
                  (r"\bHolesky(?=[A-Z0-9_]|\b)", "SilaHolesky"),
                  (r"\bDeneb(?=[A-Z0-9_]|\b)", "SilaDeneb"),
                  (r"\bFulu(?=[A-Z0-9_]|\b)", "SilaFulu"),
                  (r"\bPeerDAS(?=[A-Z0-9_]|\b)", "SilaPeerDAS"),
                  (r"\bCancun(?=[A-Z0-9_]|\b)", "SilaCancun"),
                  (r"\bShanghai(?=[A-Z0-9_]|\b)", "SilaShanghai"),
                  (r"\bPrague(?=[A-Z0-9_]|\b)", "SilaPrague"),
                  (r"\bOsaka(?=[A-Z0-9_]|\b)", "SilaOsaka"),
                  (r"\bParis(?=[A-Z0-9_]|\b)", "SilaParis"),
                  (r"\bAmsterdam(?=[A-Z0-9_]|\b)", "SilaAmsterdam"),
                  (r"\bKovan(?=[A-Z0-9_]|\b)", "SilaKovan"),
              ]
              for pat, repl in rules:
                  s = re.sub(pat, repl, s)

              # Network value only; Java package mainnet is normalized separately below.
              s = re.sub(r'(?<![A-Za-z0-9_-])mainnet(?![A-Za-z0-9_-])', 'sila-mainnet', s)
              return s

          def path_transform(raw):
              parts = raw.split("/")
              out = []
              java_path = "/java/" in ("/" + raw + "/")
              for part in parts:
                  if part == "ethereum":
                      part = "sila"
                  elif part == "eth":
                      part = "sil"
                  elif part == "evm":
                      part = "savm"
                  elif part == "mainnet":
                      part = "silaMainnet" if java_path else "sila-mainnet"
                  else:
                      part = token_transform(part)
                  out.append(part)
              return "/".join(out)

          files = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          files = [p for p in files if p]

          # Rewrite text while preserving independent third-party words.
          for raw in files:
              p = Path(raw)
              if not p.is_file():
                  continue
              try:
                  data = p.read_bytes()
                  text = data.decode("utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              # Parser-safe package segments first.
              text = text.replace(".ethereum.", ".sila.")
              text = text.replace("/ethereum/", "/sila/")
              text = text.replace(".evm.", ".savm.")
              text = text.replace("/evm/", "/savm/")
              text = text.replace(".eth.", ".sil.")
              text = text.replace("/eth/", "/sil/")
              text = text.replace(".mainnet.", ".silaMainnet.")
              text = text.replace("/mainnet/", "/sila-mainnet/")
              text = token_transform(text)
              if text != data.decode("utf-8"):
                  p.write_text(text, encoding="utf-8")

          collisions = []
          for raw in sorted(files, key=lambda x: (x.count("/"), len(x)), reverse=True):
              src = Path(raw)
              if not src.exists():
                  continue
              dst = Path(path_transform(raw))
              if dst == src:
                  continue
              dst.parent.mkdir(parents=True, exist_ok=True)
              if dst.exists():
                  collisions.append((raw, str(dst)))
                  continue
              src.rename(dst)

          if collisions:
              print(f"PATH_COLLISION_COUNT={len(collisions)}")
              for old, new in collisions[:100]:
                  print(f"COLLISION {old} -> {new}")
              raise SystemExit(2)

          # Restore third-party / external API spellings that are not Sila-owned identities.
          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              fixes = {
                  "de.undsrcouch": "de.undercouch",
                  "io.promsileus": "io.prometheus",
                  "Promsileus": "Prometheus",
                  "promsileus": "prometheus",
                  "savmVersion": "evmVersion",
                  "jsonrpc.msilods": "jsonrpc.methods",
                  "/msilods/": "/methods/",
                  ".msilods.": ".methods.",
              }
              new = text
              for old, good in fixes.items():
                  new = new.replace(old, good)
              if new != text:
                  path.write_text(new, encoding="utf-8")

          print("SAFE_SILA_GENERATION=PASS")
          PY
          git add -A
          echo "GENERATED_CHANGED_PATHS=$(git diff --cached --name-only | wc -l)"
          ./gradlew spotlessApply
          git add -A
          ./gradlew build -x test -x spotlessCheck

  checkLicense:
    name: "Check License"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1
        with:
          cache-disabled: true
      - name: run checkLicense
        run: ./gradlew --no-parallel checkLicense # no-parallel due to https://github.com/jk1/Gradle-License-Report/issues/337
      - name: upload license report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: checkLicense
          path: build/reports/dependency-license

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [spotless, checkLicense, gradleWrapper, checkNoBinaries]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1
        with:
          cache-disabled: true
      - name: Gradle Build
        run: ./gradlew build -x test -x spotlessCheck
      - name: Upload tar.gz
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: besu-tar
          path: build/distributions/besu-*.tar.gz
          retention-days: 10
      - name: Upload zip
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: besu-zip
          path: build/distributions/besu-*.zip
          retention-days: 10
      - name: Upload workspace build
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: assemble-output
          path: |
            ./
            !./.git/**
          retention-days: 1
          include-hidden-files: 'true'

  # Supply chain security: verifies that source JARs for all dependencies are recorded
  # in verification-metadata.xml. Prevents tampered or undeclared source artifacts
  # from being introduced without explicit sign-off.
  verifySourceMetadata:
    name: "Verify Dependency Source Metadata"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [spotless, checkLicense, gradleWrapper, checkNoBinaries]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6.0.1
        with:
          cache-disabled: true
      - name: Verify source artifacts recorded in verification-metadata.xml
        run: ./gradlew verifySourceArtifacts

  # Tests
  # Each suite has its suite-tests-passed job in the file directly
  unitTests:
    if: github.event_name == 'pull_request'
    needs: [spotless, checkLicense, gradleWrapper, checkNoBinaries]
    permissions:
      actions: read
      contents: read
      checks: write
      statuses: write
    uses: ./.github/workflows/unit-tests.yml

  integrationTests:
    if: github.event_name == 'pull_request'
    needs: [spotless, checkLicense, gradleWrapper, checkNoBinaries]
    permissions:
      actions: read
      contents: read
      checks: write
      statuses: write      
    uses: ./.github/workflows/integration-tests.yml

  referenceTests:
    if: github.event_name == 'pull_request'
    needs: [spotless, checkLicense, gradleWrapper, checkNoBinaries]
    permissions:
      actions: read
      contents: read
      packages: read
      checks: write
      statuses: write
    uses: ./.github/workflows/reference-tests.yml
    secrets: inherit

  acceptanceTests:
    if: github.event_name == 'pull_request'
    needs: [spotless, checkLicense, gradleWrapper, checkNoBinaries]
    permissions:
      actions: read
      contents: read
      checks: write
      statuses: write
    uses: ./.github/workflows/acceptance-tests.yml
    secrets: inherit

  dockerBuildTest:
    needs: build
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/docker-build-test.yml
    with:
      assemble_run_id: ${{ github.run_id }}
      cache_scope: ci-pr-build
    secrets: inherit

  # only fires on merge to main, so 'develop' is kept up to date
  dockerPublish:
    needs: [build, dockerBuildTest]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: develop
      cache_scope: ci-pr-build
    secrets: inherit

  allTestsPassed:
    name: allTestsPassed
    runs-on: ubuntu-latest
    needs: [verifySourceMetadata, unitTests, integrationTests, referenceTests, acceptanceTests, dockerBuildTest]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Fail on workflow error
        run: exit 1
        if: >-
          ${{
            contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
            || contains(needs.*.result, 'skipped')
          }}    