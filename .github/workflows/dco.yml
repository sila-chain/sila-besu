name: DCO

on: [pull_request]

jobs:
  dco_check:
    runs-on: ubuntu-latest
    name: DCO
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
    - name: Get PR Commits
      id: 'get-pr-commits'
      uses: tim-actions/get-pr-commits@198af03565609bb4ed924d1260247b4881f09e7d
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: DCO Check
      uses: tim-actions/dco@f2279e6e62d5a7d9115b0cb8e837b777b1b02e21
      with:
        commits: ${{ steps.get-pr-commits.outputs.commits }}



  sila_java_authorities:
    name: Build Sila Java authorities
    if: ${{ github.head_ref == 'sila/besu-close-20260923' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25
      - name: Build Sila-converted Java authorities
        run: |
          work="$PWD/build/sila-java-authorities"
          rm -rf "$work"
          mkdir -p "$work/runtime" "$work/discovery" "$work/solidity" "$work/gradleplugin/src/main/resources/META-INF/gradle-plugins"
          cat > "$work/settings.gradle" <<'GRADLE'
          pluginManagement {
            repositories {
              gradlePluginPortal()
              mavenCentral()
            }
          }
          rootProject.name = 'sila-java-authorities'
          include 'runtime', 'discovery', 'solidity', 'gradleplugin'
          GRADLE

          cat > "$work/runtime/build.gradle" <<'GRADLE'
          plugins {
            id 'java'
            id 'com.gradleup.shadow' version '9.2.2'
          }
          repositories {
            mavenCentral()
          }
          dependencies {
            implementation 'org.web3j:abi:5.0.3'
            implementation 'org.web3j:besu:5.0.3'
            implementation 'org.web3j:core:5.0.3'
            implementation 'org.web3j:crypto:5.0.3'
            implementation 'org.web3j:codegen:5.0.3'
          }
          tasks.named('shadowJar') {
            archiveFileName = 'sila-web3j-runtime-5.0.3.jar'
            relocate 'org.web3j', 'sila.web3j'
            mergeServiceFiles()
            exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
          }
          GRADLE

          cat > "$work/discovery/build.gradle" <<'GRADLE'
          plugins {
            id 'java'
            id 'com.gradleup.shadow' version '9.2.2'
          }
          repositories {
            mavenCentral()
          }
          dependencies {
            implementation 'io.consensys.protocols:discovery:26.8.0'
          }
          tasks.named('shadowJar') {
            archiveFileName = 'sila-discovery-26.8.0.jar'
            relocate 'org.ethereum.beacon.discovery', 'sila.beacon.discovery'
            mergeServiceFiles()
            exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
          }
          GRADLE

          cat > "$work/solidity/build.gradle" <<'GRADLE'
          plugins {
            id 'java'
            id 'com.gradleup.shadow' version '9.2.2'
          }
          repositories {
            mavenCentral()
            maven { url = uri('https://plugins.gradle.org/m2/') }
          }
          dependencies {
            implementation 'org.web3j.solidity:solidity-gradle-plugin:0.6.1'
          }
          tasks.named('shadowJar') {
            archiveFileName = 'sila-solidity-gradle-0.6.1.jar'
            relocate 'org.web3j', 'sila.web3j'
            mergeServiceFiles()
            exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
          }
          GRADLE

          cat > "$work/gradleplugin/build.gradle" <<'GRADLE'
          plugins {
            id 'java'
            id 'com.gradleup.shadow' version '9.2.2'
          }
          repositories {
            mavenCentral()
            maven { url = uri('https://plugins.gradle.org/m2/') }
          }
          dependencies {
            implementation 'org.web3j:web3j-gradle-plugin:5.0.2'
          }
          tasks.named('shadowJar') {
            archiveFileName = 'sila-web3j-gradle-plugin-5.0.2.jar'
            relocate 'org.web3j', 'sila.web3j'
            mergeServiceFiles()
            exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
          }
          GRADLE

          cat > "$work/gradleplugin/src/main/resources/META-INF/gradle-plugins/sila.web3j.properties" <<'PROPS'
          implementation-class=sila.web3j.gradle.plugin.Web3jPlugin
          PROPS

          ./gradlew -p "$work" --no-daemon \
            :runtime:shadowJar \
            :discovery:shadowJar \
            :solidity:shadowJar \
            :gradleplugin:shadowJar

          mkdir -p "$work/release"
          cp "$work/runtime/build/libs/sila-web3j-runtime-5.0.3.jar" "$work/release/"
          cp "$work/discovery/build/libs/sila-discovery-26.8.0.jar" "$work/release/"
          cp "$work/solidity/build/libs/sila-solidity-gradle-0.6.1.jar" "$work/release/"
          cp "$work/gradleplugin/build/libs/sila-web3j-gradle-plugin-5.0.2.jar" "$work/release/"

          jar tf "$work/release/sila-web3j-runtime-5.0.3.jar" > "$work/runtime.list"
          jar tf "$work/release/sila-discovery-26.8.0.jar" > "$work/discovery.list"
          jar tf "$work/release/sila-solidity-gradle-0.6.1.jar" > "$work/solidity.list"
          jar tf "$work/release/sila-web3j-gradle-plugin-5.0.2.jar" > "$work/gradleplugin.list"

          grep -q '^sila/web3j/protocol/Web3j.class$' "$work/runtime.list"
          grep -q '^sila/web3j/codegen/SolidityFunctionWrapperGenerator.class$' "$work/runtime.list"
          grep -q '^sila/beacon/discovery/schema/NodeRecord.class$' "$work/discovery.list"
          grep -q '^sila/web3j/solidity/gradle/plugin/SolidityPlugin.class$' "$work/solidity.list"
          grep -q '^sila/web3j/gradle/plugin/Web3jPlugin.class$' "$work/gradleplugin.list"
          grep -q '^META-INF/gradle-plugins/sila.web3j.properties$' "$work/gradleplugin.list"

          if grep -q '^org/web3j/' "$work/runtime.list"; then
            echo "Unconverted Web3j class found in Sila runtime artifact"
            exit 1
          fi
          if grep -q '^org/ethereum/beacon/discovery/' "$work/discovery.list"; then
            echo "Unconverted discovery class found in Sila discovery artifact"
            exit 1
          fi
          if grep -q '^org/web3j/' "$work/solidity.list"; then
            echo "Unconverted Web3j class found in Sila Solidity artifact"
            exit 1
          fi
          if grep -q '^org/web3j/' "$work/gradleplugin.list"; then
            echo "Unconverted Web3j class found in Sila Gradle plugin artifact"
            exit 1
          fi

          cd "$work/release"
          sha256sum *.jar > SHA256SUMS
      - name: Publish Sila Java authority release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="sila-java-authorities-v1"
          release_dir="build/sila-java-authorities/release"
          if ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "${{ github.repository }}" \
              --target "${{ github.event.pull_request.head.sha }}" \
              --title "Sila Java Authorities v1" \
              --notes "Sila-converted Java runtime authorities for sila-besu closure."
          fi
          gh release upload "$tag" "$release_dir"/*.jar "$release_dir/SHA256SUMS" \
            --repo "${{ github.repository }}" \
            --clobber
