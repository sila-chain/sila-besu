name: DCO

on: [pull_request]

jobs:
  dco_check:
    runs-on: ubuntu-latest
    name: DCO
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
    - name: Get PR Commits
      id: 'get-pr-commits'
      uses: tim-actions/get-pr-commits@198af03565609bb4ed924d1260247b4881f09e7d
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: DCO Check
      uses: tim-actions/dco@f2279e6e62d5a7d9115b0cb8e837b777b1b02e21
      with:
        commits: ${{ steps.get-pr-commits.outputs.commits }}



  sila_java_authorities:
    name: Build Sila Java authorities
    if: ${{ github.head_ref == 'sila/besu-close-20260923' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 25
      - name: Build Sila-converted Java authorities
        run: |
          work="$PWD/build/sila-java-authorities"
          rm -rf "$work"
          mkdir -p "$work/runtime" "$work/discovery" "$work/kzg" "$work/solidity/src/main/resources/META-INF/gradle-plugins" "$work/gradleplugin/src/main/resources/META-INF/gradle-plugins"
          cat > "$work/settings.gradle" <<'GRADLE'
          pluginManagement {
            repositories {
              gradlePluginPortal()
              mavenCentral()
            }
          }
          rootProject.name = 'sila-java-authorities'
          include 'runtime', 'discovery', 'kzg', 'solidity', 'gradleplugin'
          GRADLE

          cat > "$work/runtime/build.gradle" <<'GRADLE'
          plugins {
            id 'java'
            id 'com.gradleup.shadow' version '9.2.2'
          }
          repositories {
            mavenCentral()
          }
          dependencies {
            implementation 'org.web3j:abi:5.0.3'
            implementation 'org.web3j:besu:5.0.3'
            implementation 'org.web3j:core:5.0.3'
            implementation 'org.web3j:crypto:5.0.3'
            implementation 'org.web3j:codegen:5.0.3'
          }
          tasks.named('shadowJar') {
            archiveFileName = 'sila-web3j-runtime-5.0.3.jar'
            relocate 'org.web3j', 'sila.web3j'
            mergeServiceFiles()
            exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
          }
          GRADLE

          cat > "$work/discovery/build.gradle" <<'GRADLE'
          plugins {
            id 'java'
            id 'com.gradleup.shadow' version '9.2.2'
          }
          repositories {
            mavenCentral()
          }
          dependencies {
            implementation 'io.consensys.protocols:discovery:26.8.0'
          }
          tasks.named('shadowJar') {
            archiveFileName = 'sila-discovery-26.8.0.jar'
            relocate 'org.ethereum.beacon.discovery', 'sila.beacon.discovery'
            mergeServiceFiles()
            exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
          }
          GRADLE

          cat > "$work/kzg/build.gradle" <<'GRADLE'
          plugins {
            id 'java'
            id 'com.gradleup.shadow' version '9.2.2'
          }
          repositories {
            mavenCentral()
          }
          dependencies {
            implementation 'io.consensys.protocols:jc-kzg-4844:2.1.8'
          }
          tasks.named('shadowJar') {
            archiveFileName = 'sila-ckzg4844-2.1.8.jar'
            relocate 'ethereum.ckzg4844', 'sila.ckzg4844'
            mergeServiceFiles()
            exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
          }
          GRADLE

          cat > "$work/solidity/build.gradle" <<'GRADLE'
          plugins {
            id 'java'
            id 'com.gradleup.shadow' version '9.2.2'
          }
          repositories {
            mavenCentral()
            maven { url = uri('https://plugins.gradle.org/m2/') }
          }
          dependencies {
            implementation 'org.web3j.solidity:solidity-gradle-plugin:0.6.1'
          }
          tasks.named('shadowJar') {
            archiveFileName = 'sila-solidity-gradle-0.6.1.jar'
            relocate 'org.web3j', 'sila.web3j'
            mergeServiceFiles()
            exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
            exclude 'META-INF/gradle-plugins/org.web3j.solidity.properties'
          }
          GRADLE

          cat > "$work/solidity/src/main/resources/META-INF/gradle-plugins/sila.web3j.solidity.properties" <<'PROPS'
          implementation-class=sila.web3j.solidity.gradle.plugin.SolidityPlugin
          PROPS

          cat > "$work/gradleplugin/build.gradle" <<'GRADLE'
          plugins {
            id 'java'
            id 'com.gradleup.shadow' version '9.2.2'
          }
          repositories {
            mavenCentral()
            maven { url = uri('https://plugins.gradle.org/m2/') }
          }
          dependencies {
            implementation 'org.web3j:web3j-gradle-plugin:5.0.2'
          }
          tasks.named('shadowJar') {
            archiveFileName = 'sila-web3j-gradle-plugin-5.0.2.jar'
            relocate 'org.web3j', 'sila.web3j'
            mergeServiceFiles()
            exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
            exclude 'META-INF/gradle-plugins/org.web3j.properties'
          }
          GRADLE

          cat > "$work/gradleplugin/src/main/resources/META-INF/gradle-plugins/sila.web3j.properties" <<'PROPS'
          implementation-class=sila.web3j.gradle.plugin.Web3jPlugin
          PROPS

          ./gradlew -p "$work" --no-daemon \
            :runtime:shadowJar \
            :discovery:shadowJar \
            :kzg:shadowJar \
            :solidity:shadowJar \
            :gradleplugin:shadowJar

          mkdir -p "$work/release"
          cp "$work/runtime/build/libs/sila-web3j-runtime-5.0.3.jar" "$work/release/"
          cp "$work/discovery/build/libs/sila-discovery-26.8.0.jar" "$work/release/"
          cp "$work/kzg/build/libs/sila-ckzg4844-2.1.8.jar" "$work/release/"
          cp "$work/solidity/build/libs/sila-solidity-gradle-0.6.1.jar" "$work/release/"
          cp "$work/gradleplugin/build/libs/sila-web3j-gradle-plugin-5.0.2.jar" "$work/release/"

          jar tf "$work/release/sila-web3j-runtime-5.0.3.jar" > "$work/runtime.list"
          jar tf "$work/release/sila-discovery-26.8.0.jar" > "$work/discovery.list"
          jar tf "$work/release/sila-ckzg4844-2.1.8.jar" > "$work/kzg.list"
          jar tf "$work/release/sila-solidity-gradle-0.6.1.jar" > "$work/solidity.list"
          jar tf "$work/release/sila-web3j-gradle-plugin-5.0.2.jar" > "$work/gradleplugin.list"

          grep -q '^sila/web3j/protocol/Web3j.class$' "$work/runtime.list"
          grep -q '^sila/web3j/codegen/SolidityFunctionWrapperGenerator.class$' "$work/runtime.list"
          grep -q '^sila/beacon/discovery/schema/NodeRecord.class$' "$work/discovery.list"
          grep -q '^sila/ckzg4844/CKZG4844JNI.class$' "$work/kzg.list"
          grep -q '^sila/web3j/solidity/gradle/plugin/SolidityPlugin.class$' "$work/solidity.list"
          grep -q '^META-INF/gradle-plugins/sila.web3j.solidity.properties$' "$work/solidity.list"
          grep -q '^sila/web3j/gradle/plugin/Web3jPlugin.class$' "$work/gradleplugin.list"
          grep -q '^META-INF/gradle-plugins/sila.web3j.properties$' "$work/gradleplugin.list"

          if grep -q '^org/web3j/' "$work/runtime.list"; then
            echo "Unconverted Web3j class found in Sila runtime artifact"
            exit 1
          fi
          if grep -q '^org/ethereum/beacon/discovery/' "$work/discovery.list"; then
            echo "Unconverted discovery class found in Sila discovery artifact"
            exit 1
          fi
          if grep -q '^ethereum/ckzg4844/' "$work/kzg.list"; then
            echo "Unconverted Ethereum CKZG class found in Sila KZG artifact"
            exit 1
          fi
          if grep -q '^org/web3j/' "$work/solidity.list" || grep -q '^META-INF/gradle-plugins/org.web3j.solidity.properties$' "$work/solidity.list"; then
            echo "Unconverted Web3j identity found in Sila Solidity artifact"
            exit 1
          fi
          if grep -q '^org/web3j/' "$work/gradleplugin.list" || grep -q '^META-INF/gradle-plugins/org.web3j.properties$' "$work/gradleplugin.list"; then
            echo "Unconverted Web3j identity found in Sila Gradle plugin artifact"
            exit 1
          fi

          cd "$work/release"
          sha256sum *.jar > SHA256SUMS
      - name: Publish Sila Java authority release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="sila-java-authorities-v1"
          release_dir="build/sila-java-authorities/release"
          if ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "${{ github.repository }}" \
              --target "${{ github.event.pull_request.head.sha }}" \
              --title "Sila Java Authorities v1" \
              --notes "Sila-converted Java runtime authorities for sila-besu closure."
          fi
          gh release upload "$tag" "$release_dir"/*.jar "$release_dir/SHA256SUMS" \
            --repo "${{ github.repository }}" \
            --clobber


  sila_build_authorities:
    name: Publish Sila build authorities
    if: \${{ github.head_ref == 'sila/besu-close-20260923' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish verified Sila build authority assets
        shell: bash
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -u
          tag="sila-build-authorities-v1"
          repo="\${{ github.repository }}"
          target="\${{ github.event.pull_request.head.sha }}"
          work="$RUNNER_TEMP/sila-build-authorities"
          mkdir -p "$work"

          if ! gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$repo" \
              --target "$target" \
              --title "Sila Build Authorities v1" \
              --notes "Verified Sila-owned build authorities for execution fixtures and Solidity compiler binaries."
          fi

          has_asset() {
            gh release view "$tag" --repo "$repo" --json assets \
              --jq '.assets[].name' | grep -Fxq "$1"
          }

          publish_asset() {
            src="$1"
            name="$2"
            expected="$3"
            if has_asset "$name"; then
              echo "ASSET_PRESENT=$name"
              return 0
            fi
            dest="$work/$name"
            curl -L --fail --retry 4 --retry-delay 3 --connect-timeout 30 \
              --output "$dest" "$src"
            actual="$(sha256sum "$dest" | awk '{print $1}')"
            echo "ASSET=$name"
            echo "EXPECTED_SHA256=$expected"
            echo "ACTUAL_SHA256=$actual"
            test "$actual" = "$expected"
            gh release upload "$tag" "$dest" --repo "$repo"
            rm -f "$dest"
          }

          publish_asset \
            "https://github.com/ethereum/execution-specs/releases/download/tests%40v20.0.2/fixtures.tar.gz" \
            "execution-specs-tests@v20.0.2-fixtures.tar.gz" \
            "1280540950a4c3470a421416b6f35458a9b635827265c29e5aef1ae839ae1788"

          publish_asset \
            "https://github.com/ethereum/execution-specs/releases/download/tests-glamsterdam-devnet%40v8.1.4/fixtures_glamsterdam-devnet.tar.gz" \
            "execution-specs-tests-glamsterdam-devnet@v8.1.4-fixtures_glamsterdam-devnet.tar.gz" \
            "aed315489163dc67c4e5607d7bbb8902e8329afe939be58193b125f2e81a85d4"

          publish_asset \
            "https://raw.githubusercontent.com/argotorg/solc-bin/gh-pages/linux-amd64/solc-linux-amd64-v0.8.19%2Bcommit.7dd6d404" \
            "solc-0.8.19-linux-amd64" \
            "7a5c1d3dc9a8eba62bb2ec37192c9178ae5fe8a54a56e5573fd3c9c17cd9eb48"
          publish_asset \
            "https://raw.githubusercontent.com/argotorg/solc-bin/gh-pages/macosx-amd64/solc-macosx-amd64-v0.8.19%2Bcommit.7dd6d404" \
            "solc-0.8.19-macosx-amd64" \
            "38c8523ab67e0b3e21c48189d6bfb99ad6879b9ce02e0d802ec8be598bb2622d"
          publish_asset \
            "https://raw.githubusercontent.com/argotorg/solc-bin/gh-pages/windows-amd64/solc-windows-amd64-v0.8.19%2Bcommit.7dd6d404.exe" \
            "solc-0.8.19-windows-amd64.exe" \
            "00d3b5ca64b097964ed6d70d9805a63fdd27113b07c1b2559dbfdd579f994508"

          publish_asset \
            "https://raw.githubusercontent.com/argotorg/solc-bin/gh-pages/linux-amd64/solc-linux-amd64-v0.8.25%2Bcommit.b61c2a91" \
            "solc-0.8.25-linux-amd64" \
            "c42aada7a52057ddbed93ec011235e256c564c440b68dbaac5ae482babbb3d6d"
          publish_asset \
            "https://raw.githubusercontent.com/argotorg/solc-bin/gh-pages/macosx-amd64/solc-macosx-amd64-v0.8.25%2Bcommit.b61c2a91" \
            "solc-0.8.25-macosx-amd64" \
            "cc3f94a70ac681b0304084acc1980aabe2a1bb3240d44ce76a8df0e1e77a2110"
          publish_asset \
            "https://raw.githubusercontent.com/argotorg/solc-bin/gh-pages/windows-amd64/solc-windows-amd64-v0.8.25%2Bcommit.b61c2a91.exe" \
            "solc-0.8.25-windows-amd64.exe" \
            "5f2947705f3db7c8e267742038f5c7e43009ba1e63a27a0b6fd4bdb1ccc25a5c"

          echo "SILA_BUILD_AUTHORITIES_PUBLISHED=1"
